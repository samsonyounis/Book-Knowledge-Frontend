<div class="container-fluid pt-5 my-5">

    <section class="d-flex justify-content-center align-items-center vh-100 bg-light">
        <div class="card p-4" style="width: 24rem;">
          <h3 class="text-center mb-4">Register</h3>
          <form (submit)="onRegister()" #registerForm="ngForm">
            <div class="mb-3">
              <label for="name" class="form-label">Full Name</label>
              <input type="text" id="name" class="form-control" required [(ngModel)]="name"
               name="name" #fullName="ngModel">
            </div>
            <div *ngIf="fullName.invalid && fullName.touched" class="text-danger">
              Name is required
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input type="email" id="email" class="form-control" required [(ngModel)]="email" name="email" 
              #email="ngModel">
            </div>
            <!-- <div *ngIf="email.invalid && email.touched" class="text-danger">
              <div *ngIf="email.errors?.['required']">Email is required</div>
              <div *ngIf="email.errors?.['email']">Invalid email address</div>          
            </div> -->

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" id="password" class="form-control" 
              required [(ngModel)]="password" name="password" #password="ngModel">
            </div>
            <div *ngIf="password.invalid && password.touched" class="text-danger">
              Password is required
            </div>

            <div class="mb-3">
              <label for="confirmPassword" class="form-label">Confirm Password</label>
              <input type="password" id="confirmPassword" class="form-control" required [(ngModel)]="confirmPassword" name="confirmPassword">
            </div>

            <button type="submit" class="btn btn-primary w-100" [disabled]="!registerForm.form.valid">Register</button>
            <p class="text-center mt-3">
              Already have an account? <a routerLink="/login">Login here</a>
            </p>
          </form>
        </div>
      </section>      

</div>
